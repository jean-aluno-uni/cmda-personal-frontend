<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMDA Personal — RPM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="app-wrapper">
    <div class="page">

      <header id="main-header" class="header"></header>

      <main class="content">

        <h2 class="section-title">RPM atual</h2>

        <div class="card" style="align-items:center;text-align:center">
          <div id="rpm-gauge"></div>
          <p id="rpm-footnote" class="rpm-footnote hidden">* Desempenho esperado</p>
        </div>

        <h2 class="section-title mt-20">Status</h2>

        <div class="card" id="rpm-status-card"></div>

        <h2 class="section-title mt-20">Diagnóstico</h2>

        <div class="card" style="padding:0;overflow:hidden">
          <table class="data-table" id="diag-table"></table>
        </div>

      </main>

      <nav id="bottom-nav" class="bottom-nav"></nav>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/app.js"></script>
  <script>
    var RPM_MAX = 3000;
    var veiculoId = null;

    function base() {
      return '/vehicles/' + veiculoId;
    }

    function semDados(texto, cor) {
      document.getElementById('rpm-gauge').innerHTML =
        '<p style="text-align:center;color:' + (cor || 'var(--text-secondary)') + ';font-size:13px;padding:48px 0 16px">' + esc(texto) + '</p>';
      document.getElementById('rpm-status-card').innerHTML =
        '<p class="metric-disconnected" style="font-size:13px;color:var(--text-secondary)">' + esc(texto) + '</p>';
    }

    function renderStatus(rpm) {
      var statusLabel, statusClass, statusDesc;
      if (rpm < 750) {
        statusLabel = 'Baixo';
        statusClass = 'status-badge status-high';
        statusDesc  = 'RPM abaixo do mínimo esperado. Verifique o motor.';
      } else if (rpm < 1500) {
        statusLabel = 'Ocioso';
        statusClass = 'status-badge status-medium';
        statusDesc  = 'Motor em marcha lenta.';
      } else if (rpm <= 2800) {
        statusLabel = 'Normal';
        statusClass = 'status-badge status-ok';
        statusDesc  = 'Motor operando dentro da faixa esperada.';
      } else {
        statusLabel = 'Alto';
        statusClass = 'status-badge status-high';
        statusDesc  = 'RPM elevado. Reduza a aceleração.';
      }

      document.getElementById('rpm-status-card').innerHTML = `
        <div class="status-row">
          <div>
            <div class="card-title" style="margin-bottom:4px">Condição atual</div>
            <p style="font-size:13px;color:var(--text-secondary);margin:0">${statusDesc}</p>
          </div>
          <span class="${statusClass}">${statusLabel}</span>
        </div>`;
    }

    async function carregarTelemetria() {
      semDados('Carregando...');
      var t;
      try {
        t = await apiCall(base() + '/telemetry/latest');
      } catch (e) {
        semDados(e.message, 'var(--primary)');
        return;
      }

      if (!t.disponivel || t.rpm === null) {
        semDados(t.motivo === 'sem_leituras' || t.disponivel ? 'Nenhuma leitura recebida do veículo' : 'Veículo não conectado');
        return;
      }

      renderRpmGauge('rpm-gauge', t.rpm, RPM_MAX);
      document.getElementById('rpm-footnote').classList.remove('hidden');
      renderStatus(t.rpm);
    }

    async function carregarDiagnostico() {
      var diagTable = document.getElementById('diag-table');
      var cabecalho = `
        <thead>
          <tr>
            <th>Indicador</th>
            <th>Valor</th>
            <th>Observação</th>
          </tr>
        </thead>`;

      diagTable.innerHTML = cabecalho + '<tbody><tr><td colspan="3">' + msgCard('Carregando...') + '</td></tr></tbody>';

      try {
        var diag = await apiCall(base() + '/diagnostics?indicadores=RPM,Velocidade');
        var linhas = diag.itens.map(function (d, i) {
          var isLast = i === diag.itens.length - 1;
          return `<tr style="${isLast ? '' : 'border-bottom:1px solid var(--border)'}">
            <td>${esc(d.indicador)}</td>
            <td class="${d.alerta ? 'td-warn' : ''}">${esc(d.valor)}</td>
            <td style="color:var(--text-secondary);font-size:12px">${esc(d.observacao) || '—'}</td>
          </tr>`;
        }).join('');

        diagTable.innerHTML = cabecalho + '<tbody>' + (linhas || '<tr><td colspan="3">' + msgCard('Sem itens de RPM no diagnóstico') + '</td></tr>') + '</tbody>';
      } catch (e) {
        var cor = e.status === 404 ? null : 'var(--primary)';
        diagTable.innerHTML = cabecalho + '<tbody><tr><td colspan="3">' + msgCard(e.message, cor) + '</td></tr></tbody>';
      }
    }

    async function carregarVeiculo() {
      try {
        var veiculo = await apiCall(base());
        renderHeader({ back: ROTAS.home, greeting: 'RPM do motor', vehicle: veiculo.modelo });
        atualizarBadgeAlertas(veiculoId);
      } catch (e) {
      }
    }

    if (verificarAuth()) {
      veiculoId = lerVeiculoId();

      renderHeader({ back: ROTAS.home, greeting: 'RPM do motor' });
      renderBottomNav('');

      if (!veiculoId) {
        semDados('Nenhum veículo vinculado a esta conta.');
      } else {
        carregarVeiculo();
        carregarTelemetria();
        carregarDiagnostico();
      }
    }
  </script>
</body>
</html>
