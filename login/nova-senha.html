<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMDA SmartFleet — Nova Senha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="app-wrapper">
    <div class="page">

      <!-- Header Auth -->
      <header class="header-auth">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0110 0v4"/>
        </svg>
        <h1>Nova senha</h1>
      </header>

      <!-- Sheet -->
      <main class="auth-sheet">

        <a href="otp.html" class="auth-back">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
          Voltar
        </a>

        <div class="field">
          <label class="field-label" for="nova-senha">Nova senha</label>
          <input class="field-input" type="password" id="nova-senha" placeholder="Mínimo 8 caracteres" autocomplete="new-password">
        </div>

        <div class="field">
          <label class="field-label" for="confirma-senha">Confirmar nova senha</label>
          <input class="field-input" type="password" id="confirma-senha" placeholder="Repita a senha" autocomplete="new-password">
        </div>

        <!-- Link informações -->
        <div class="info-row" id="btn-info" role="button" tabindex="0" aria-label="Ver requisitos da senha">
          <span>Requisitos da senha</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C2182B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>
          </svg>
        </div>

        <p id="msg-erro" class="mb-16 text-red hidden" style="font-size:13px"></p>

        <button class="btn btn-primary" id="btn-redefinir">Redefinir senha</button>

      </main>
    </div>
  </div>

  <!-- Modal: Regras de senha -->
  <div class="modal-overlay hidden" id="modal-info" role="dialog" aria-modal="true" aria-labelledby="modal-info-titulo">
    <div class="modal-box">
      <div class="modal-header">
        <span class="modal-title" id="modal-info-titulo">Requisitos da senha</span>
        <button class="modal-close" id="fechar-info" aria-label="Fechar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div id="lista-regras"></div>
    </div>
  </div>

  <!-- Modal: Sucesso -->
  <div class="modal-overlay hidden" id="modal-sucesso" role="dialog" aria-modal="true" aria-labelledby="modal-sucesso-titulo">
    <div class="modal-box">
      <div class="success-center">
        <div class="success-icon" id="success-icon-wrap"></div>
        <p class="success-msg" id="modal-sucesso-titulo">Senha redefinida com sucesso!<br>Faça login com sua nova senha.</p>
        <button class="btn btn-primary" id="btn-ok-sucesso">OK</button>
      </div>
    </div>
  </div>

  <script src="../js/dados.js"></script>
  <script src="../js/app.js"></script>
  <script>
    // Renderiza ícone de sucesso via SVG
    document.getElementById('success-icon-wrap').innerHTML = icoSuccess();

    var regras = [
      { id: 'len',     label: 'Mínimo 8 caracteres',         fn: function (v) { return v.length >= 8; } },
      { id: 'lower',   label: '1 letra minúscula',            fn: function (v) { return /[a-z]/.test(v); } },
      { id: 'upper',   label: '1 letra maiúscula',            fn: function (v) { return /[A-Z]/.test(v); } },
      { id: 'number',  label: '1 número',                     fn: function (v) { return /[0-9]/.test(v); } },
      { id: 'special', label: '1 caractere especial (!@#$%)', fn: function (v) { return /[!@#$%^&*(),.?":{}|<>]/.test(v); } }
    ];

    // Renderiza lista de regras
    function renderRegras(senha) {
      var lista = document.getElementById('lista-regras');
      lista.innerHTML = regras.map(function (r) {
        var estado = senha.length === 0 ? 'idle' : (r.fn(senha) ? 'ok' : 'fail');
        return `<div class="pw-rule">
          <span class="pw-dot ${estado}"></span>
          <span>${r.label}</span>
        </div>`;
      }).join('');
    }

    // Atualiza ao digitar
    document.getElementById('nova-senha').addEventListener('input', function () {
      if (!document.getElementById('modal-info').classList.contains('hidden')) {
        renderRegras(this.value);
      }
    });

    // Abre modal de informações
    document.getElementById('btn-info').addEventListener('click', function () {
      renderRegras(document.getElementById('nova-senha').value);
      document.getElementById('modal-info').classList.remove('hidden');
    });

    document.getElementById('fechar-info').addEventListener('click', function () {
      document.getElementById('modal-info').classList.add('hidden');
    });

    // Redefinir senha
    document.getElementById('btn-redefinir').addEventListener('click', function () {
      var nova     = document.getElementById('nova-senha').value;
      var confirma = document.getElementById('confirma-senha').value;
      var msgErro  = document.getElementById('msg-erro');

      if (!nova || !confirma) {
        msgErro.textContent = 'Preencha todos os campos.';
        msgErro.classList.remove('hidden');
        return;
      }

      var todasOk = regras.every(function (r) { return r.fn(nova); });
      if (!todasOk) {
        msgErro.textContent = 'A senha não atende aos requisitos de segurança.';
        msgErro.classList.remove('hidden');
        return;
      }

      if (nova !== confirma) {
        msgErro.textContent = 'As senhas não coincidem.';
        msgErro.classList.remove('hidden');
        return;
      }

      msgErro.classList.add('hidden');
      document.getElementById('modal-sucesso').classList.remove('hidden');
    });

    document.getElementById('btn-ok-sucesso').addEventListener('click', function () {
      sessionStorage.removeItem('sf_email_otp');
      window.location.href = ROTAS.login;
    });
  </script>
</body>
</html>
