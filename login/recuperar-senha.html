<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMDA SmartFleet — Recuperar Senha</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="app-wrapper">
    <div class="page">

      <!-- Header Auth -->
      <header class="header-auth">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0110 0v4"/>
        </svg>
        <h1>Recuperar senha</h1>
      </header>

      <!-- Sheet -->
      <main class="auth-sheet">

        <a href="index.html" class="auth-back">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
          Voltar ao login
        </a>

        <p class="auth-desc">
          Informe seu e-mail e enviaremos um código de verificação para redefinição de senha.
        </p>

        <form id="form-recuperar" novalidate>
          <div class="field">
            <label class="field-label" for="email">E-mail</label>
            <input class="field-input" type="email" id="email"
                   placeholder="seu@email.com"
                   autocomplete="email" inputmode="email"
                   autocapitalize="off" spellcheck="false">
          </div>

          <p id="msg-erro" class="mt-8 text-red hidden" style="font-size:13px" role="alert"></p>

          <div class="mt-24">
            <button type="submit" class="btn btn-primary" id="btn-recuperar">Enviar código</button>
          </div>
        </form>

      </main>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/app.js"></script>
  <script>
    var btn     = document.getElementById('btn-recuperar');
    var msgErro = document.getElementById('msg-erro');

    function mostrarErro(texto) {
      msgErro.textContent = texto;
      msgErro.classList.remove('hidden');
    }

    document.getElementById('form-recuperar').addEventListener('submit', async function (e) {
      e.preventDefault();
      var email = document.getElementById('email').value.trim();

      if (!email) {
        mostrarErro('Informe o e-mail.');
        return;
      }

      if (!email.includes('@')) {
        mostrarErro('Informe um e-mail válido.');
        return;
      }

      msgErro.classList.add('hidden');
      btn.disabled = true;
      btn.textContent = 'Enviando...';

      try {
        await apiCall('/auth/password/forgot', { method: 'POST', body: { email: email } });
        // E-mail segue para a tela do código pelo sessionStorage
        sessionStorage.setItem('sf_email_otp', email);
        sessionStorage.removeItem('sf_reset_token');
        window.location.href = ROTAS.otp;
      } catch (err) {
        mostrarErro(err.message || 'Não foi possível enviar o código. Tente novamente.');
        btn.disabled = false;
        btn.textContent = 'Enviar código';
      }
    });
  </script>
</body>
</html>
