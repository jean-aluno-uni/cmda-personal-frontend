<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMDA Personal — Código de Verificação</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="app-wrapper">
    <div class="page">

      <!-- Header Auth -->
      <header class="header-auth">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 10.8a19.79 19.79 0 01-3.07-8.68A2 2 0 012 0h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.09 7.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 14.92z"/>
        </svg>
        <h1>Código de verificação</h1>
      </header>

      <!-- Sheet -->
      <main class="auth-sheet">

        <a href="recuperar-senha.html" class="auth-back">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
          Voltar
        </a>

        <p class="auth-desc">
          Digite o código de 6 dígitos enviado para
          <span class="auth-email-highlight" id="email-exibido"></span>
        </p>

        <!-- 6 caixas OTP -->
        <div class="otp-row" role="group" aria-label="Campos de código OTP">
          <input class="otp-box" type="text" maxlength="1" inputmode="numeric" id="otp-0" aria-label="Dígito 1">
          <input class="otp-box" type="text" maxlength="1" inputmode="numeric" id="otp-1" aria-label="Dígito 2">
          <input class="otp-box" type="text" maxlength="1" inputmode="numeric" id="otp-2" aria-label="Dígito 3">
          <input class="otp-box" type="text" maxlength="1" inputmode="numeric" id="otp-3" aria-label="Dígito 4">
          <input class="otp-box" type="text" maxlength="1" inputmode="numeric" id="otp-4" aria-label="Dígito 5">
          <input class="otp-box" type="text" maxlength="1" inputmode="numeric" id="otp-5" aria-label="Dígito 6">
        </div>

        <!-- Reenviar + Verificar -->
        <div class="otp-actions">
          <button class="otp-resend" id="btn-reenviar" type="button">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/>
            </svg>
            Reenviar código
          </button>
          <button class="btn btn-primary btn-sm" id="btn-verificar">Verificar</button>
        </div>

        <p id="msg-erro" class="mt-16 text-red hidden" style="font-size:13px;text-align:center"></p>

      </main>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/app.js"></script>
  <script>
    // Sem e-mail da etapa anterior, volta ao início da recuperação
    var email = sessionStorage.getItem('sf_email_otp');
    if (!email) {
      window.location.replace(ROTAS.recuperarSenha);
    }
    document.getElementById('email-exibido').textContent = email || '';

    var msgErro = document.getElementById('msg-erro');

    function mostrarErro(texto) {
      msgErro.textContent = texto;
      msgErro.classList.remove('hidden');
    }

    var inputs = document.querySelectorAll('.otp-box');

    // Auto-avança para o próximo campo
    inputs.forEach(function (input, i) {
      input.addEventListener('input', function () {
        var val = this.value.replace(/\D/g, '');
        this.value = val;
        if (val && i < inputs.length - 1) {
          inputs[i + 1].focus();
        }
      });

      // Backspace volta ao anterior
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Backspace' && !this.value && i > 0) {
          inputs[i - 1].focus();
        }
      });
    });

    // Foco automático no primeiro campo
    inputs[0].focus();

    // Reenviar
    var btnReenviar = document.getElementById('btn-reenviar');
    var htmlReenviar = btnReenviar.innerHTML;

    btnReenviar.addEventListener('click', async function () {
      btnReenviar.disabled = true;
      msgErro.classList.add('hidden');
      try {
        await apiCall('/auth/password/otp/resend', { method: 'POST', body: { email: email } });
        btnReenviar.textContent = 'Código reenviado!';
      } catch (err) {
        mostrarErro(err.message || 'Não foi possível reenviar o código.');
      }
      setTimeout(function () {
        btnReenviar.innerHTML = htmlReenviar;
        btnReenviar.disabled = false;
      }, 2500);
    });

    // Verificar
    var btnVerificar = document.getElementById('btn-verificar');

    btnVerificar.addEventListener('click', async function () {
      var codigo = Array.from(inputs).map(function (i) { return i.value; }).join('');

      if (codigo.length < 6) {
        mostrarErro('Digite todos os 6 dígitos.');
        return;
      }

      msgErro.classList.add('hidden');
      btnVerificar.disabled = true;
      btnVerificar.textContent = 'Verificando...';

      try {
        var verificacao = await apiCall('/auth/password/otp/verify', {
          method: 'POST',
          body: { email: email, codigo: codigo }
        });
        // resetToken segue para a tela de nova senha pelo sessionStorage
        sessionStorage.setItem('sf_reset_token', verificacao.resetToken);
        window.location.href = ROTAS.novaSenha;
      } catch (err) {
        mostrarErro(err.message || 'Não foi possível verificar o código.');
        inputs.forEach(function (i) { i.value = ''; });
        inputs[0].focus();
        btnVerificar.disabled = false;
        btnVerificar.textContent = 'Verificar';
      }
    });
  </script>
</body>
</html>
