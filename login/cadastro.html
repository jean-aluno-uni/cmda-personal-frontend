<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMDA SmartFleet — Criar Conta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="app-wrapper">
    <div class="page">

      <!-- Header Auth -->
      <header class="header-auth">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <line x1="19" y1="8" x2="19" y2="14"/>
          <line x1="22" y1="11" x2="16" y2="11"/>
        </svg>
        <h1>Criar conta</h1>
        <p>Etapa 1 de 2 · Seus dados</p>
      </header>

      <!-- Sheet -->
      <main class="auth-sheet">

        <a href="index.html" class="auth-back">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
          Voltar ao login
        </a>

        <form id="form-cadastro" novalidate>

          <div class="field">
            <label class="field-label" for="nome">Nome completo</label>
            <input class="field-input" type="text" id="nome" name="nome"
                   placeholder="Seu nome" autocomplete="name" autocapitalize="words">
          </div>

          <div class="field">
            <label class="field-label" for="email">E-mail</label>
            <input class="field-input" type="email" id="email" name="email"
                   placeholder="seu@email.com" autocomplete="email" inputmode="email"
                   autocapitalize="off" spellcheck="false">
          </div>

          <div class="field">
            <label class="field-label" for="senha">Senha</label>
            <input class="field-input" type="password" id="senha" name="senha"
                   placeholder="Crie uma senha" autocomplete="new-password"
                   aria-describedby="regras-senha">
            <div class="pw-rules-inline" id="regras-senha" aria-live="polite"></div>
          </div>

          <div class="field">
            <label class="field-label" for="confirma-senha">Confirmar senha</label>
            <input class="field-input" type="password" id="confirma-senha" name="confirma-senha"
                   placeholder="Repita a senha" autocomplete="new-password">
          </div>

          <p id="msg-erro" class="mb-16 text-red hidden" style="font-size:13px" role="alert"></p>

          <button type="submit" class="btn btn-primary" id="btn-cadastrar">Criar conta</button>

        </form>

        <p class="auth-footer">
          Já tem uma conta? <a href="index.html">Entrar</a>
        </p>

      </main>
    </div>
  </div>

  <script src="../js/dados.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/api.js"></script>
  <script>
    if (sessionStorage.getItem(SESSAO.token)) {
      window.location.href = ROTAS.home;
    }

    var btn     = document.getElementById('btn-cadastrar');
    var msgErro = document.getElementById('msg-erro');
    var campoSenha = document.getElementById('senha');

    function mostrarErro(texto) {
      msgErro.textContent = texto;
      msgErro.classList.remove('hidden');
    }

    renderRegrasSenha('regras-senha', '');
    campoSenha.addEventListener('input', function () {
      renderRegrasSenha('regras-senha', this.value);
    });

    document.getElementById('form-cadastro').addEventListener('submit', async function (e) {
      e.preventDefault();
      var nome     = document.getElementById('nome').value.trim();
      var email    = document.getElementById('email').value.trim();
      var senha    = campoSenha.value;
      var confirma = document.getElementById('confirma-senha').value;

      if (!nome || !email || !senha || !confirma) {
        mostrarErro('Preencha todos os campos.');
        return;
      }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        mostrarErro('Informe um e-mail válido.');
        return;
      }
      if (!senhaValida(senha)) {
        mostrarErro('A senha não atende aos requisitos de segurança.');
        return;
      }
      if (senha !== confirma) {
        mostrarErro('As senhas não coincidem.');
        return;
      }

      msgErro.classList.add('hidden');
      btn.disabled = true;
      btn.textContent = 'Criando conta...';

      try {
        // Usa o token do cadastro, se vier; senão faz login com as mesmas credenciais
        var token = extrairToken(await API.registrar(nome, email, senha))
          || extrairToken(await API.login(email, senha));
        if (!token) throw new ApiError(500, 'Conta criada, mas não foi possível entrar. Faça login.');

        sessionStorage.setItem(SESSAO.token, token);
        sessionStorage.setItem(SESSAO.conectado, 'false');
        salvarUsuarioSessao({ name: nome, email: email });
        window.location.href = ROTAS.vincularVeiculo;
      } catch (err) {
        if (err.status === 409) {
          mostrarErro('Já existe uma conta com este e-mail.');
        } else {
          mostrarErro(err.message || 'Não foi possível criar a conta. Tente novamente.');
        }
        btn.disabled = false;
        btn.textContent = 'Criar conta';
      }
    });
  </script>
</body>
</html>
