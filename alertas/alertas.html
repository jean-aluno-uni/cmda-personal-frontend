<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMDA Personal — Alertas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="app-wrapper">
    <div class="page">

      <header id="main-header" class="header"></header>

      <main class="content">

        <!-- Seletor de período -->
        <div class="period-selector" role="group" aria-label="Filtro por período">
          <button class="period-btn active" data-period="24h">24h</button>
          <button class="period-btn" data-period="7d">7 dias</button>
          <button class="period-btn" data-period="30d">30 dias</button>
        </div>

        <h2 class="section-title">Origem dos alertas</h2>

        <div class="card" id="origem-card">
          <div class="alerta-chart-wrap">
            <!-- Container com dimensões fixas para o donut funcionar corretamente -->
            <div style="position:relative;width:130px;height:130px;flex-shrink:0">
              <div id="donut-chart"></div>
              <div class="donut-center-label">
                <div class="donut-total" id="donut-total">—</div>
                <div class="donut-sublabel">alertas</div>
              </div>
            </div>
            <div id="donut-legend" class="alerta-legend-row"></div>
          </div>
        </div>

        <!-- Lista de alertas -->
        <h2 class="section-title mt-20" style="display:flex;align-items:center;justify-content:space-between">
          Todos os alertas
          <button id="btn-expandir" class="expand-btn" aria-label="Ver todos os alertas">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
          </button>
        </h2>

        <div class="card" style="padding:0;overflow:hidden" id="alertas-card">
          <table class="data-table" id="alertas-table"></table>
        </div>

      </main>

      <nav id="bottom-nav" class="bottom-nav"></nav>
    </div>
  </div>

  <!-- Modal: todos os alertas -->
  <div class="modal-overlay hidden" id="modal-todos-alertas" role="dialog" aria-modal="true" aria-labelledby="modal-alertas-titulo">
    <div class="modal-box" style="max-height:82vh;display:flex;flex-direction:column">
      <div class="modal-header">
        <span class="modal-title" id="modal-alertas-titulo">Todos os alertas</span>
        <button class="modal-close" id="fechar-modal-alertas" aria-label="Fechar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <p id="modal-alertas-subtitulo" style="font-size:12px;color:var(--text-secondary);margin-bottom:12px"></p>
      <div id="modal-alertas-lista" style="overflow-y:auto;flex:1"></div>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/app.js"></script>
  <script>
    // modelo de tela integrada: verificarAuth -> le o id do veiculo -> apiCall nas rotas -> renderiza
    // enquanto espera mostra "Carregando...", se der erro mostra a mensagem que veio da API
    // alertas sao historico gravado no banco, entao aparecem mesmo com o veiculo desconectado

    var LABEL_PERIODO = { '24h': 'nas últimas 24 horas', '7d': 'nos últimos 7 dias', '30d': 'nos últimos 30 dias' };
    var CABECALHO_TABELA = '<thead><tr><th>Descricao</th><th>Tempo</th><th>Local</th></tr></thead>';

    var periodoAtivo = '24h';
    var veiculoId = null;

    function base() {
      return '/vehicles/' + veiculoId;
    }

    // nome do veiculo no header
    async function carregarVeiculo() {
      try {
        var veiculo = await apiCall(base());
        renderHeader({ back: ROTAS.home, greeting: 'Alertas', vehicle: veiculo.modelo });
        atualizarBadgeAlertas(veiculoId);
      } catch (e) {
        // header sem o nome do veiculo nao impede o resto da tela
      }
    }

    // --- SELETOR DE PERÍODO ---
    var btns = document.querySelectorAll('.period-btn');
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener('click', function () {
        if (!veiculoId) return;
        for (var j = 0; j < btns.length; j++) { btns[j].classList.remove('active'); }
        this.classList.add('active');
        periodoAtivo = this.getAttribute('data-period');
        carregarResumo();
      });
    }

    // GET /vehicles/{id}/alerts/summary?period=... -> donut + tabela
    async function carregarResumo() {
      var periodo = periodoAtivo;
      mostrarCarregando();
      try {
        var resumo = await apiCall(base() + '/alerts/summary?period=' + periodo);
        if (periodo !== periodoAtivo) return; // usuario ja trocou de periodo
        renderCharts(resumo);
        renderTabela(resumo.tabelaAlertas);
      } catch (e) {
        if (periodo !== periodoAtivo) return;
        mostrarErro(e.message);
      }
    }

    function mostrarCarregando() {
      document.getElementById('donut-total').textContent = '…';
      renderDonutChart('donut-chart', [{ percentual: 100, cor: '#E5E7EB' }], 130);
      document.getElementById('donut-legend').innerHTML =
        '<p style="font-size:12px;color:var(--text-secondary);margin-top:4px">Carregando...</p>';
      document.getElementById('alertas-table').innerHTML = CABECALHO_TABELA +
        '<tbody><tr><td colspan="3" style="text-align:center;color:var(--text-secondary);padding:20px;font-size:13px">Carregando...</td></tr></tbody>';
    }

    function mostrarErro(mensagem) {
      document.getElementById('donut-total').textContent = '—';
      renderDonutChart('donut-chart', [{ percentual: 100, cor: '#E5E7EB' }], 130);
      document.getElementById('donut-legend').innerHTML =
        '<p style="font-size:12px;color:var(--primary);margin-top:4px">' + esc(mensagem) + '</p>';
      document.getElementById('alertas-table').innerHTML = CABECALHO_TABELA +
        '<tbody><tr><td colspan="3" style="text-align:center;color:var(--primary);padding:20px;font-size:13px">Não foi possível carregar os alertas</td></tr></tbody>';
    }

    // --- DONUT + LEGENDA ---
    function renderCharts(resumo) {
      document.getElementById('donut-total').textContent = resumo.total;

      if (resumo.total === 0) {
        renderDonutChart('donut-chart', [{ percentual: 100, cor: '#E5E7EB' }], 130);
        document.getElementById('donut-legend').innerHTML =
          '<p style="font-size:12px;color:var(--text-secondary);margin-top:4px">Nenhum alerta ' + LABEL_PERIODO[periodoAtivo] + '</p>';
        return;
      }

      renderDonutChart('donut-chart', resumo.origemAlertas.map(function (o) {
        return { percentual: o.percentual, cor: o.cor };
      }), 130);

      var legendHTML = '';
      for (var i = 0; i < resumo.origemAlertas.length; i++) {
        var o = resumo.origemAlertas[i];
        legendHTML += '<div class="alerta-legend-item">' +
          '<span style="width:10px;height:10px;border-radius:50%;background:' + esc(o.cor) + ';display:inline-block;flex-shrink:0"></span>' +
          '<div>' +
            '<div class="alerta-legend-local">' + esc(o.local) + '</div>' +
            '<div class="alerta-legend-pct">' + o.percentual.toFixed(1) + '%</div>' +
          '</div>' +
        '</div>';
      }
      document.getElementById('donut-legend').innerHTML = legendHTML;
    }

    // --- TABELA ---
    function renderTabela(alertas) {
      var tabela = document.getElementById('alertas-table');

      if (alertas.length === 0) {
        tabela.innerHTML = CABECALHO_TABELA +
          '<tbody><tr><td colspan="3" style="text-align:center;color:var(--text-secondary);padding:20px;font-size:13px">Nenhum alerta no período</td></tr></tbody>';
        return;
      }

      var linhas = '';
      for (var i = 0; i < alertas.length; i++) {
        var a = alertas[i];
        var isLast = i === alertas.length - 1;
        linhas += '<tr style="' + (isLast ? '' : 'border-bottom:1px solid var(--border)') + '">' +
          '<td><div style="display:flex;align-items:center;gap:7px">' +
            '<span class="alert-dot ' + esc(a.nivel) + '"></span>' +
            '<span style="font-size:13px">' + esc(a.titulo) + '</span>' +
          '</div></td>' +
          '<td style="font-size:12px;color:var(--text-secondary);white-space:nowrap">' + tempoRelativo(a.dataHora) + '</td>' +
          '<td style="font-size:12px;color:var(--text-secondary);white-space:nowrap">' + esc(a.origem) + '</td>' +
        '</tr>';
      }

      tabela.innerHTML = CABECALHO_TABELA + '<tbody>' + linhas + '</tbody>';
    }

    // --- MODAL EXPANDIR ---
    // GET /vehicles/{id}/alerts?period=...&pageSize=100 -> lista completa do periodo
    document.getElementById('btn-expandir').addEventListener('click', async function () {
      if (!veiculoId) return;
      var periodo = periodoAtivo;
      var subtitulo = document.getElementById('modal-alertas-subtitulo');
      var lista = document.getElementById('modal-alertas-lista');

      subtitulo.textContent = '';
      lista.innerHTML = msgCard('Carregando...');
      document.getElementById('modal-todos-alertas').classList.remove('hidden');

      try {
        var resp = await apiCall(base() + '/alerts?period=' + periodo + '&pageSize=100');
        subtitulo.textContent = resp.total + ' alertas ' + LABEL_PERIODO[periodo];

        if (resp.items.length === 0) {
          lista.innerHTML = msgCard('Nenhum alerta no período');
          return;
        }

        var listaHTML = '';
        for (var i = 0; i < resp.items.length; i++) {
          var a = resp.items[i];
          var isLast = i === resp.items.length - 1;
          listaHTML += '<div style="display:flex;align-items:flex-start;gap:10px;padding:11px 0;' +
            (isLast ? '' : 'border-bottom:1px solid var(--border)') + '">' +
            '<span class="alert-dot ' + esc(a.nivel) + '" style="margin-top:3px;flex-shrink:0"></span>' +
            '<div style="flex:1">' +
              '<div style="font-size:13px;font-weight:600;color:var(--text-primary)">' + esc(a.titulo) + '</div>' +
              (a.descricao ? '<div style="font-size:12px;color:var(--text-secondary);margin-top:2px">' + esc(a.descricao) + '</div>' : '') +
              '<div style="font-size:11px;color:var(--text-secondary);margin-top:2px">' + tempoRelativo(a.dataHora) + ' · ' + esc(a.origem) + '</div>' +
            '</div>' +
          '</div>';
        }
        lista.innerHTML = listaHTML;
      } catch (e) {
        lista.innerHTML = msgCard(e.message, 'var(--primary)');
      }
    });

    document.getElementById('fechar-modal-alertas').addEventListener('click', function () {
      document.getElementById('modal-todos-alertas').classList.add('hidden');
    });

    document.getElementById('modal-todos-alertas').addEventListener('click', function (e) {
      if (e.target === this) {
        this.classList.add('hidden');
      }
    });

    // --- INÍCIO ---
    if (verificarAuth()) {
      veiculoId = lerVeiculoId();

      renderHeader({ back: ROTAS.home, greeting: 'Alertas' });
      renderBottomNav('');

      if (!veiculoId) {
        mostrarErro('Nenhum veículo vinculado a esta conta.');
      } else {
        carregarVeiculo();
        carregarResumo();
      }
    }
  </script>
</body>
</html>
