<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMDA SmartFleet — Login</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="app-wrapper">
    <div class="page">

      <!-- Header Auth -->
      <header class="header-auth">
        <svg width="72" height="72" viewBox="0 0 72 72" fill="none" aria-hidden="true">
          <circle cx="36" cy="36" r="36" fill="rgba(255,255,255,0.12)"/>
          <circle cx="36" cy="36" r="34" stroke="rgba(255,255,255,0.45)" stroke-width="1.5"/>
          <circle cx="36" cy="24" r="10" stroke="white" stroke-width="2.5"/>
          <path d="M16 58c0-11 9-20 20-20s20 9 20 20" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        <h1>Bem-vindo de volta</h1>
        <p>Entre com suas credenciais para acessar o sistema</p>
      </header>

      <!-- Sheet -->
      <main class="auth-sheet">
        <form id="form-login" novalidate>

          <div class="field">
            <label class="field-label" for="email">E-mail</label>
            <input class="field-input" type="email" id="email" name="email"
                   placeholder="seu@email.com" autocomplete="username" inputmode="email"
                   autocapitalize="off" spellcheck="false">
          </div>

          <div class="field">
            <label class="field-label" for="senha">Senha</label>
            <input class="field-input" type="password" id="senha" name="senha"
                   placeholder="••••••••••" autocomplete="current-password">
          </div>

          <a href="recuperar-senha.html" class="field-link">Esqueci minha senha</a>

          <p id="msg-erro" class="mt-8 text-red hidden" style="font-size:13px" role="alert"></p>

          <div class="mt-24">
            <button type="submit" class="btn btn-primary" id="btn-entrar">Entrar</button>
          </div>

        </form>
      </main>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/app.js"></script>
  <script>
    var form    = document.getElementById('form-login');
    var btn     = document.getElementById('btn-entrar');
    var msgErro = document.getElementById('msg-erro');

    function mostrarErro(texto) {
      msgErro.textContent = texto;
      msgErro.classList.remove('hidden');
    }

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      var email = document.getElementById('email').value.trim();
      var senha = document.getElementById('senha').value;

      if (!email || !senha) {
        mostrarErro('Preencha todos os campos.');
        return;
      }

      msgErro.classList.add('hidden');
      btn.disabled = true;
      btn.textContent = 'Entrando...';

      try {
        var login = await apiCall('/auth/login', { method: 'POST', body: { email: email, senha: senha } });
        salvarToken(login.accessToken);

        // Busca o veículo antes de abrir a home
        var veiculos = await apiCall('/vehicles');
        if (veiculos && veiculos.length > 0) {
          salvarVeiculoId(veiculos[0].id);
        }

        window.location.href = ROTAS.home;
      } catch (err) {
        limparSessao();
        mostrarErro(err.message || 'Não foi possível entrar. Tente novamente.');
        btn.disabled = false;
        btn.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
