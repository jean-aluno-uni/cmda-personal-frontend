<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMDA Personal — Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="app-wrapper">
    <div class="page">

      <header id="main-header" class="header"></header>

      <!-- Painel do veículo -->
      <div id="hero-panel" class="hero"></div>

      <!-- Conteúdo principal -->
      <main class="content">

        <h2 class="section-title">Overview</h2>

        <!-- Card: Condições do Motor -->
        <a href="condicoes-motor.html" class="card-link">
          <div class="card">
            <div class="card-top">
              <div>
                <div class="card-title">Condições do motor</div>
                <div class="card-subtitle">Temperaturas</div>
              </div>
              <span id="ico-chevron-motor"></span>
            </div>
            <div id="temp-row" class="temp-row"></div>
          </div>
        </a>

        <!-- Grid: Velocidade + Alertas -->
        <div class="grid-2">

          <!-- Velocidade -->
          <div class="card" style="margin-bottom:0;display:flex;flex-direction:column;height:100%">
            <div class="card-title">Velocidade</div>
            <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;margin-top:8px">
              <span id="ico-speed"></span>
              <div id="vel-value"></div>
              <p id="vel-disconnected" class="metric-disconnected hidden">Veículo não conectado</p>
            </div>
          </div>

          <!-- Alertas -->
          <a href="../alertas/alertas.html" class="card-link" style="margin-bottom:0">
            <div class="card" style="height:100%">
              <div class="card-top">
                <div class="card-title">Alertas</div>
                <span id="ico-chevron-alertas"></span>
              </div>
              <div id="alertas-content"></div>
            </div>
          </a>

        </div>

        <!-- RPM -->
        <a href="rpm.html" class="card-link mt-12">
          <div class="card">
            <div class="card-top">
              <div class="card-title">RPM</div>
              <span id="ico-chevron-rpm"></span>
            </div>
            <div class="metric-icon-row" style="justify-content:center">
              <span id="ico-rpm"></span>
              <div id="rpm-value"></div>
              <span id="ico-warn-rpm" class="hidden"></span>
            </div>
          </div>
        </a>

      </main>

      <nav id="bottom-nav" class="bottom-nav"></nav>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/app.js"></script>
  <script>
    var veiculoId = null;
    var nomeUsuario = '';
    var modeloVeiculo = '';
    var icoBt = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><polyline points="6.5 6.5 17.5 17.5 12 23 12 1 17.5 6.5 6.5 17.5"/></svg>';

    function base() {
      return '/vehicles/' + veiculoId;
    }

    function saudacao() {
      var hora = new Date().getHours();
      if (hora < 12) return 'Bom dia';
      if (hora < 18) return 'Boa tarde';
      return 'Boa noite';
    }

    function atualizarHeader() {
      renderHeader({ greeting: saudacao() + (nomeUsuario ? ', ' + esc(nomeUsuario) : ''), vehicle: modeloVeiculo });
      atualizarBadgeAlertas(veiculoId);
    }

    async function carregarUsuario() {
      try {
        var usuario = await apiCall('/users/me');
        nomeUsuario = usuario.nome;
        atualizarHeader();
      } catch (e) {
      }
    }

    async function carregarVeiculo() {
      var heroPainel = document.getElementById('hero-panel');
      try {
        var veiculo = await apiCall(base());
        modeloVeiculo = veiculo.modelo || '';
        atualizarHeader();
        renderHero(veiculo);
      } catch (e) {
        heroPainel.innerHTML = '';
      }
    }

    function renderHero(veiculo) {
      var heroPainel = document.getElementById('hero-panel');
      if (veiculo.conectado) {
        heroPainel.innerHTML = `
          <img src="../img/carro.png" alt="Foto do veículo ${esc(veiculo.modelo)}" class="hero-img">
          <div class="hero-overlay">
            <button class="hero-connect-btn hero-disconnect-btn" id="btn-conexao">
              ${icoBt} Desconectar
            </button>
          </div>`;
      } else {
        heroPainel.innerHTML = `
          <img src="../img/carro-desativado.png" alt="Veículo desconectado" class="hero-img">
          <div class="hero-overlay">
            <button class="hero-connect-btn" id="btn-conexao">
              ${icoBt} Conectar ao veículo
            </button>
          </div>`;
      }

      var btn = document.getElementById('btn-conexao');
      btn.addEventListener('click', async function () {
        btn.disabled = true;
        try {
          await apiCall(base() + (veiculo.conectado ? '/disconnect' : '/connect'), { method: 'POST' });
          window.location.reload();
        } catch (e) {
          btn.disabled = false;
          alert(e.message);
        }
      });
    }

    function renderTemperaturas(t) {
      var tempRow = document.getElementById('temp-row');
      if (!t) {
        tempRow.innerHTML = `
          <div class="temp-item">
            <span class="temp-icon">${icoWater('#D1D5DB', 22)}</span>
            <span class="temp-value" style="color:var(--text-light)">— °C</span>
            <span class="temp-label">Líquido de arrefecimento</span>
          </div>
          <div class="temp-item">
            <span class="temp-icon">${icoOil('#D1D5DB', 22)}</span>
            <span class="temp-value" style="color:var(--text-light)">— °C</span>
            <span class="temp-label">Óleo</span>
          </div>
          <div class="temp-item">
            <span class="temp-icon">${icoAir('#D1D5DB', 22)}</span>
            <span class="temp-value" style="color:var(--text-light)">— °C</span>
            <span class="temp-label">Ar de admissão</span>
          </div>`;
        return;
      }

      var oilWarn = t.tempOleo !== null && t.tempOleo > 85;
      tempRow.innerHTML = `
        <div class="temp-item">
          <span class="temp-icon">${icoWater('#3B82F6', 22)}</span>
          <span class="temp-value">${grau(t.tempLiquido)}</span>
          <span class="temp-label">Líquido de arrefecimento</span>
        </div>
        <div class="temp-item">
          <span class="temp-icon">${icoOil(oilWarn ? '#C2182B' : '#F59E0B', 22)}</span>
          <span class="temp-value ${oilWarn ? 'warn' : ''}">${grau(t.tempOleo)}${oilWarn ? ' ⚠' : ''}</span>
          <span class="temp-label">Óleo</span>
        </div>
        <div class="temp-item">
          <span class="temp-icon">${icoAir('#9CA3AF', 22)}</span>
          <span class="temp-value">${grau(t.tempAr)}</span>
          <span class="temp-label">Ar de admissão</span>
        </div>`;
    }

    function grau(valor) {
      return valor === null ? '— °C' : Math.round(valor) + ' °C';
    }

    async function carregarTelemetria() {
      var velEl = document.getElementById('vel-value');
      var velMsg = document.getElementById('vel-disconnected');
      var rpmEl = document.getElementById('rpm-value');
      var warnEl = document.getElementById('ico-warn-rpm');

      velEl.innerHTML = '<span class="metric-dash">…</span>';
      rpmEl.innerHTML = '<span class="metric-dash">…</span>';

      var t;
      try {
        t = await apiCall(base() + '/telemetry/latest');
      } catch (e) {
        renderTemperaturas(null);
        velEl.innerHTML = '<span class="metric-dash">—</span>';
        rpmEl.innerHTML = '<span class="metric-dash">—</span>';
        velMsg.textContent = e.message;
        velMsg.classList.remove('hidden');
        return;
      }

      if (!t.disponivel) {
        renderTemperaturas(null);
        velEl.innerHTML = '<span class="metric-dash">—</span>';
        rpmEl.innerHTML = '<span class="metric-dash">—</span>';
        velMsg.textContent = t.motivo === 'sem_leituras' ? 'Nenhuma leitura recebida' : 'Veículo não conectado';
        velMsg.classList.remove('hidden');
        return;
      }

      renderTemperaturas(t);
      velEl.innerHTML = t.velocidadeKmh === null
        ? '<span class="metric-dash">—</span>'
        : `<span class="metric-value">${Math.round(t.velocidadeKmh)} <span class="metric-unit">km/h</span></span>`;

      if (t.rpm === null) {
        rpmEl.innerHTML = '<span class="metric-dash">—</span>';
      } else {
        rpmEl.innerHTML = `<span class="metric-value">${t.rpm.toLocaleString('pt-BR')}</span>`;
        if (t.rpm < 750) {
          warnEl.innerHTML = icoWarning();
          warnEl.classList.remove('hidden');
        }
      }
    }

    async function carregarAlertas() {
      var alertasContent = document.getElementById('alertas-content');
      alertasContent.innerHTML = msgCard('Carregando...');

      try {
        var resumo = await apiCall(base() + '/alerts/summary?period=24h');
        if (resumo.tabelaAlertas.length === 0) {
          alertasContent.innerHTML = '<p class="metric-disconnected">Nenhum alerta nas últimas 24h</p>';
          return;
        }

        var itens = resumo.tabelaAlertas.slice(0, 3).map(function (a) {
          return `<div class="alert-item">
            <span class="alert-dot ${esc(a.nivel)}"></span>
            <div class="alert-body">
              <div class="alert-title">${esc(a.titulo)}</div>
              <div class="alert-meta">${tempoRelativo(a.dataHora)} · ${esc(a.origem)}</div>
            </div>
          </div>`;
        }).join('');

        var restantes = resumo.total - 3;
        alertasContent.innerHTML = `<div class="alert-list">${itens}</div>
          ${restantes > 0 ? `<p class="alerts-more">+${restantes} ${restantes === 1 ? 'alerta' : 'alertas'}</p>` : ''}`;
      } catch (e) {
        alertasContent.innerHTML = msgCard(e.message, 'var(--primary)');
      }
    }

    if (verificarAuth()) {
      veiculoId = lerVeiculoId();

      renderHeader({ greeting: saudacao() });
      renderBottomNav('home');

      document.getElementById('ico-chevron-motor').innerHTML   = icoChevron();
      document.getElementById('ico-chevron-alertas').innerHTML = icoChevron();
      document.getElementById('ico-chevron-rpm').innerHTML     = icoChevron();
      document.getElementById('ico-speed').innerHTML           = icSpeed();
      document.getElementById('ico-rpm').innerHTML             = icoRpm();

      carregarUsuario();

      if (!veiculoId) {
        renderTemperaturas(null);
        document.getElementById('alertas-content').innerHTML = msgCard('Nenhum veículo vinculado a esta conta.');
      } else {
        carregarVeiculo();
        carregarTelemetria();
        carregarAlertas();
      }
    }
  </script>
</body>
</html>
